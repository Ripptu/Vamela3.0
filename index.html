<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- SEO Metadata -->
    <title>VAMELA | Exklusives Webdesign & Branding – Haag an der Amper</title>
    <meta name="description" content="Websites, die Kunden gewinnen. VAMELA entwickelt modernes Webdesign, Logos und SEO-Strategien für Unternehmen in Freising, München & Landshut." />
    <meta name="keywords" content="Webdesign Haag an der Amper, Werbeagentur Freising, Logo Design, SEO, Christian Stockmeier, VAMELA" />
    <meta name="author" content="Christian Stockmeier" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="VAMELA | Webdesign & Branding" />
    <meta property="og:description" content="Lass uns deine Vision digital sichtbar machen. High-End Webdesign aus Haag an der Amper." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.vamela.info" />
    <meta property="og:image" content="https://framerusercontent.com/images/dkfZWs67IxX9Sb9uDq2HYuGySQ.png" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:site_name" content="VAMELA" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M20 20 L50 90 L80 20' fill='none' stroke='%23D4F250' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=La+Belle+Aurore&display=swap" rel="stylesheet">

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                lime: '#D4F250',
                dark: '#050505',
                gray: '#1A1A1A',
                surface: '#111111',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
              signature: ['"La Belle Aurore"', 'cursive'],
            },
            backgroundImage: {
              'hero-pattern': "url('https://framerusercontent.com/images/dkfZWs67IxX9Sb9uDq2HYuGySQ.png?scale-down-to=4096&width=5184&height=2997')",
            },
            animation: {
              'blob': 'blob 10s infinite',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Ensure scroll works */
      html {
        width: 100%;
        height: auto;
        overflow-x: hidden;
        scroll-snap-type: y proximity;
        scroll-padding-top: 80px; /* Offset for sticky header if needed, though header is not sticky in this design usually */
      }
      
      body {
        background-color: #050505;
        color: #ffffff;
        width: 100%;
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
      }
      
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
    </style>
</head>
  <body class="bg-brand-dark text-white antialiased">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
